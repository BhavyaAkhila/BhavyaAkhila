<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="45%" stop-color="#3a0d5e"/>
      <stop offset="70%" stop-color="#8a1a68"/>
      <stop offset="100%" stop-color="#0d0221"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe97f"/>
      <stop offset="35%" stop-color="#ff9ecb"/>
      <stop offset="70%" stop-color="#ff1493"/>
      <stop offset="100%" stop-color="#c71585"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff1493" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff1493" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff69b4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff69b4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="skyClip">
      <rect x="0" y="0" width="1200" height="300"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="url(#sky)"/>

  <g clip-path="url(#skyClip)">
    <circle cx="150" cy="55" r="1.3" fill="#ffffff" opacity="0.8"/>
    <circle cx="260" cy="30" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="340" cy="70" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="90" cy="90" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="1000" cy="40" r="1.3" fill="#ffffff" opacity="0.8"/>
    <circle cx="1080" cy="80" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="940" cy="20" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="1150" cy="60" r="1.4" fill="#ffffff" opacity="0.7"/>
    <circle cx="600" cy="25" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="700" cy="45" r="1.2" fill="#ffffff" opacity="0.6"/>

    <circle cx="600" cy="150" r="95" fill="url(#sun)"/>
    <rect x="490" y="150" width="220" height="14" fill="#1a0533"/>
    <rect x="490" y="174" width="220" height="10" fill="#1a0533"/>
    <rect x="490" y="194" width="220" height="8" fill="#1a0533"/>

    <circle cx="600" cy="220" r="260" fill="url(#glow)"/>

    <rect x="0" y="215" width="1200" height="85" fill="#12031f"/>
    <line x1="600" y1="215" x2="0" y2="300" stroke="url(#grid)" stroke-width="1.5"/>
    <line x1="600" y1="215" x2="120" y2="300" stroke="url(#grid)" stroke-width="1.5"/>
    <line x1="600" y1="215" x2="260" y2="300" stroke="url(#grid)" stroke-width="1.5"/>
    <line x1="600" y1="215" x2="420" y2="300" stroke="url(#grid)" stroke-width="1.5"/>
    <line x1="600" y1="215" x2="1200" y2="300" stroke="url(#grid)" stroke-width="1.5"/>
    <line x1="600" y1="215" x2="1080" y2="300" stroke="url(#grid)" stroke-width="1.5"/>
    <line x1="600" y1="215" x2="940" y2="300" stroke="url(#grid)" stroke-width="1.5"/>
    <line x1="600" y1="215" x2="780" y2="300" stroke="url(#grid)" stroke-width="1.5"/>
    <line x1="0" y1="228" x2="1200" y2="228" stroke="url(#grid)" stroke-width="1"/>
    <line x1="0" y1="244" x2="1200" y2="244" stroke="url(#grid)" stroke-width="1.2"/>
    <line x1="0" y1="263" x2="1200" y2="263" stroke="url(#grid)" stroke-width="1.4"/>
    <line x1="0" y1="286" x2="1200" y2="286" stroke="url(#grid)" stroke-width="1.8"/>
  </g>

  <text x="600" y="110" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="54" font-weight="700" fill="#ffffff" style="letter-spacing:2px">
    Akhila Gannireddy
  </text>
  <text x="600" y="140" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="20" font-weight="400" fill="#ffd9ec" style="letter-spacing:1px">
    AI &amp; Data Science Student  |  Java Programmer
  </text>
</svg>
